name: Deploy

# Every push to main: build and test, publish the image
# ghcr.io/cuongtranba/omninoise:sha-<short sha>, then deploy that exact tag to
# Dokploy at https://lowbit.link and wait until the site answers again.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only the image jobs get packages: write; the checks run `pnpm install`.
permissions:
  contents: read

# Plain `run:` steps get `bash -e`; this adds pipefail.
defaults:
  run:
    shell: bash

# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omninoise
  DOKPLOY_URL: https://lowbit.link/api
  DOKPLOY_COMPOSE_ID: zKgpTfdzxIcMupkBoEwx5
  SITE_URL: https://postiz.lowbit.link

jobs:
  checks:
    uses: ./.github/workflows/build.yml

  image-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-image:
    needs: [checks, image-tag]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - runnertags: ubuntu-latest
            arch: amd64
          - runnertags: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runnertags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          TAG: ${{ needs.image-tag.outputs.tag }}
        run: |
          docker buildx build --platform linux/${{ matrix.arch }} \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION="$TAG" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --pull \
            --no-cache \
            --provenance=false --sbom=false \
            --output "type=registry,name=$IMAGE:$TAG-${{ matrix.arch }}" .

  image-manifest:
    needs: [build-image, image-tag]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create Docker Manifest
        env:
          TAG: ${{ needs.image-tag.outputs.tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$TAG-amd64"
          docker buildx imagetools inspect "$IMAGE:$TAG-arm64"
          docker manifest create "$IMAGE:$TAG" --amend "$IMAGE:$TAG-amd64" --amend "$IMAGE:$TAG-arm64"
          docker manifest push "$IMAGE:$TAG"
          docker manifest inspect "$IMAGE:$TAG"

  deploy:
    needs: [image-manifest, image-tag]
    # A manual run from another branch builds its image but never deploys it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.image-tag.outputs.tag }}
      # Cloudflare sits in front of lowbit.link and challenges curl's default
      # user agent, so every call sends a browser one.
      BROWSER_UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin the image tag in the compose file
        run: |
          sed -i "s|\${IMAGE_TAG}|$TAG|" deploy/compose.yaml
          grep -q "image: $IMAGE:$TAG$" deploy/compose.yaml
          POSTIZ_HOST=example.com docker compose -f deploy/compose.yaml --env-file deploy/.env.example config -q

      - name: Push the compose file and deploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::error::Repository secret DOKPLOY_API_KEY is not set; the image $IMAGE:$TAG was published but not deployed."
            exit 1
          fi
          # The key goes to curl through a header file, not the command line.
          headers="$RUNNER_TEMP/dokploy-headers"
          (umask 077; printf 'x-api-key: %s\n' "$DOKPLOY_API_KEY" > "$headers")

          # Prints the JSON body on stdout; errors go to stderr.
          api() {
            local method=$1 path=$2 out
            local args=(-sS --fail-with-body --max-time 30 -X "$method" "$DOKPLOY_URL/$path"
              -A "$BROWSER_UA" -H "Accept: application/json" -H "Content-Type: application/json"
              -H "@$headers")
            [ $# -ge 3 ] && args+=(-d "$3")
            out=$(curl "${args[@]}") || { echo "Dokploy $path failed: $(head -c 500 <<<"$out")" >&2; return 1; }
            jq . > /dev/null <<<"$out" || { echo "Dokploy $path did not return JSON (Cloudflare challenge?): $(head -c 300 <<<"$out")" >&2; return 1; }
            echo "$out"
          }

          before=$(api GET "deployment.allByCompose?composeId=$DOKPLOY_COMPOSE_ID" | jq -c '[.[].deploymentId]')

          jq -n --rawfile f deploy/compose.yaml --arg id "$DOKPLOY_COMPOSE_ID" '{composeId: $id, composeFile: $f}' > "$RUNNER_TEMP/update.json"
          api POST compose.update "@$RUNNER_TEMP/update.json" > /dev/null

          title="$TAG: $(git log -1 --format=%s | head -c 150)"
          api POST compose.deploy "$(jq -nc --arg id "$DOKPLOY_COMPOSE_ID" --arg t "$title" '{composeId: $id, title: $t}')" > /dev/null

          # Wait for the new deployment to finish (15 minutes at most). A failed
          # poll is retried: the deployment keeps running on the server.
          for _ in $(seq 1 90); do
            sleep 10
            resp=$(api GET "deployment.allByCompose?composeId=$DOKPLOY_COMPOSE_ID") || { echo "poll failed, retrying"; continue; }
            status=$(jq -r --argjson before "$before" '[.[] | select(.deploymentId as $d | $before | index($d) | not)][0].status // "pending"' <<<"$resp")
            echo "deployment status: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo "::error::Dokploy deployment failed; read its log in Dokploy."; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for the Dokploy deployment."
          exit 1

      - name: Check the site answers
        run: |
          # The public API answers 401 without a key once the backend is up; the
          # frontend can return 500 for a few seconds after a deploy.
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null --max-time 20 -A "$BROWSER_UA" -w '%{http_code}' "$SITE_URL/api/public/v1/integrations" || true)
            echo "public API: $code"
            [ "$code" = "401" ] && exit 0
            sleep 10
          done
          echo "::error::$SITE_URL did not come back after the deploy."
          exit 1
