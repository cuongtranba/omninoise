# Dependabot version updates. Security updates are switched on separately in
# the repository settings (Code security > Dependabot security updates).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # pnpm workspace: Dependabot reads the apps/* manifests listed in
  # pnpm-workspace.yaml; libraries/* has no package.json, the root one and
  # pnpm-lock.yaml cover it
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # one pull request for every minor and patch bump, majors stay separate
      # so each breaking upgrade is reviewed on its own
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
