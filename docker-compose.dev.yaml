# This docker-compose file is used for development purposes. It sets up the necessary services for the Postiz application.
# It is **not** intended for production use. For production, please refer to the official documentation.

services:
  postiz-postgres:
    # ref: https://hub.docker.com/r/timescale/timescaledb (Postgres 17 + TimescaleDB)
    image: timescale/timescaledb:2.30.2-pg17
    container_name: postiz-postgres
    restart: always
    # Preloads the extension on a volume created by the old postgres:17-alpine image too
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=timescaledb',
        '-c',
        'timescaledb.telemetry_level=off',
      ]
    environment:
      POSTGRES_PASSWORD: postiz-local-pwd
      POSTGRES_USER: postiz-local
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - postiz-network
  postiz-pg-admin:
    # ref: https://hub.docker.com/r/dpage/pgadmin4/tags
    image: dpage/pgadmin4:latest
    container_name: postiz-pg-admin
    restart: always
    ports:
      - 8085:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - postiz-network

volumes:
  postgres-volume:
    external: false

networks:
  postiz-network:
    external: false
