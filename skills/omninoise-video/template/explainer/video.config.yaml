kitVersion: 1

video:
  id: ExplainerTemplate
  # 9:16 for TikTok, Shorts and Reels. The kit's type scale and safe area in
  # src/components/primitives.tsx are set for this frame (top 200px and bottom
  # 400px stay clear of platform UI: the top 10% and bottom 20%).
  width: 1080
  height: 1920
  fps: 30
  # Cross-fade length, repaid once per scene boundary. `defaults.leadFrames`
  # must cover it, or a line starts while the previous scene is still on screen.
  # v2 is cut tight for short-form: an 8-frame (0.27 s) fade, not a 14-frame one.
  transitionFrames: 8
  # Floor below which fraction-cued reveals land on top of each other.
  minSceneFrames: 60
  out: out
  # v2 house length: 30 to 40 seconds. CHK-26 holds the measured cut to this window.
  targetDuration:
    minSeconds: 30
    maxSeconds: 40

locales:
  default: en
  list:
    - code: en
      label: English
      # Speaking rate, used ONLY to estimate lengths before any audio exists.
      # Measured on the real takes (characters of narration / seconds of speech).
      charsPerSecond: 16.4
      # The default locale is its own baseline, so nothing to budget for.
      expansionFactor: 1.0
      font: body
      requiredSample: "The quick brown fox jumps over the lazy dog"
    - code: vi
      label: Tiếng Việt
      # Rate for estimates before any audio exists; replace it with the measured value after your first take.
      # expansionFactor covers the on-screen copy, where the widest string is the end-card line.
      charsPerSecond: 14.72
      expansionFactor: 1.8
      font: body
      # The stacked vowels and tone marks the script is built from.
      requiredSample: "Tiếng Việt: vẽ, dựng, ý tưởng, nguồn, chất liệu, chiều sâu, từng cảnh, giọng đọc, đúng giờ, ễ, ẫ, ặ, ệ, ố, ầ, ế, ữ, ợ"

# A face is declared per locale because covering latin says nothing about the
# script you are about to add: a font can carry single diacritics and silently
# drop the stacked ones another language is built from. `nv validate` reads each
# file's real cmap rather than trusting the subset it advertises.
#
# The default face ships with the `vietnamese` subset requested up front, so
# adding a `vi` locale is a config edit rather than a font hunt — the stacked
# vowels (ố ầ ế ấ ư ơ) are exactly what a latin-only face drops in silence.
fonts:
  body:
    kind: google
    family: Be Vietnam Pro
    importName: BeVietnamPro
    subsets: [latin, vietnamese]
    weights: ["400", "600", "700"]
  mono:
    kind: google
    family: Roboto Mono
    importName: RobotoMono
    subsets: [latin, vietnamese]
    weights: ["400", "500"]

# Emitted verbatim into src/generated/theme.ts. OKLCH because the renderer is
# Chrome, which parses it natively — the video quotes your palette rather than
# an approximation of it. Colour only: the type scale and the safe area are
# layout decisions the components own.
theme:
  # A near-black green background, warm white foreground (#F4FAF6) and a mint accent
  # (#3EE6AA), converted to OKLCH. Surface and border are two further steps of the same
  # green so objects read against the background. Swap these for your brand's palette
  # and keep the art.yaml style in step with it.
  background: oklch(14% 0.02 165)
  foreground: oklch(97.9% 0.008 157.1)
  muted: oklch(76% 0.02 160)
  surface: oklch(22% 0.03 163)
  border: oklch(32% 0.04 162)
  accent: oklch(82.6% 0.16 164.1)
  # Failure red for the "tests failed" stamp and every blocked verdict. Colour never
  # travels alone: each use carries its own label and a drawn cross.
  danger: oklch(68% 0.21 25)

defaults:
  # Silence at the head, and the frame the <Audio> mounts at. Equal to the
  # cross-fade (CHK-13 refuses less).
  leadFrames: 8
  # Silence after the voice stops, so the frame settles before the cut. Short on
  # purpose: the synthesized take already ends on a breath of silence.
  tailFrames: 8

# Running order. A bare id takes the defaults; a table overrides them. A
# narrated scene may NOT declare durationInFrames — that is how a hand-kept
# frame table grows back after the derivation removed it.
scenes:
  # The first scene has no scene to cross-fade from (CHK-13 skips it), so the
  # hook line starts at once: it is audible inside the first second.
  - id: Hook
    leadFrames: 3
  # The end card holds a second after the voice stops.
  - id: Outro
    tailFrames: 30

tts:
  provider: elevenlabs
  apiKeyEnv: ELEVENLABS_API_KEY
  costCapUsd: 0.5
  outputFormat: mp3_44100_128
  voices:
    en:
      # Brian, an ElevenLabs premade voice labelled for narration. Pick your own voice id.
      voiceId: nPczCjzI2devNBz1zQrb
      model: eleven_turbo_v2_5
    vi:
      # nv clears only eleven_turbo_v2_5 (with no voice_settings) for Vietnamese: other models
      # return plausible audio with wrong tones. Any TTS works if it writes one mp3 per scene plus
      # an alignment.json in the same shape as scripts/voiceover-timestamps.ts.
      voiceId: nPczCjzI2devNBz1zQrb
      model: eleven_turbo_v2_5

# Domain terms that must survive translation verbatim — a translated term stops
# being greppable, and the audience says it in English anyway.
glossary: [Codex, Claude Code, Remotion, GitHub, YouTube, Instagram]

# Strings the system itself prints. Translating one makes the video contradict
# the product it is explaining.
printedLiterals: []
